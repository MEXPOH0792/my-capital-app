version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    open-pull-requests-limit: 5
    groups:
      eslint:
        patterns:
          - eslint*
          - '@eslint/*'
      react:
        patterns:
          - react
          - react-dom
      capacitor:
        patterns:
          - '@capacitor/*'
      vite:
        patterns:
          - vite
          - '@vitejs/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
